name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :composeApp:assembleRelease

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF_NAME}
          mv composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk \
             composeApp/build/outputs/apk/release/pwunsafe-${TAG}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/release/pwunsafe-*.apk
          generate_release_notes: true
